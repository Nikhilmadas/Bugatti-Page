<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bugatti | Login</title>
    <link rel="stylesheet" href="auth.css">
</head>

<body>

    <main class="auth-page">

        <section class="auth-box">
            <a href="bugatti.html" class="back-btn"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                    fill="currentColor" class="bi bi-x-lg" viewBox="0 0 16 16">
                    <path
                        d="M2.146 2.854a.5.5 0 1 1 .708-.708L8 7.293l5.146-5.147a.5.5 0 0 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8z" />
                </svg></a>
            <a href="bugatti.html" class="logo">BUGATTI</a>

            <h1>Welcome Back</h1>
            <p class="subtitle">Enter the world of Bugatti.</p>

            <form action="#" method="post">

                <div class="input-group">
                    <label for="email">Email Address*</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>

                <div class="input-group">
                    <label for="password">Password*</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>

                <div class="login-options">

                    <a href="#">Forgot Password?</a>
                </div>
                <button type="submit" class="auth-button"  formaction="bugatti.html">
                    LOGIN
                </button>



            </form>

            <p class="switch-page">
                Don't have an account?
                <a href="signup.html">Create Account</a>
            </p>

        </section>

    </main>

</body>

</html>
